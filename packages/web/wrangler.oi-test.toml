name = "oi-test-web"
main = ".open-next/worker.js"
compatibility_date = "2025-08-15"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
keep_names = false
workers_dev = true

[vars]
CONTROL_PLANE_URL = "https://oi-test-control-plane.jayasuriya-brunthan.workers.dev"
NEXT_PUBLIC_WS_URL = "wss://oi-test-control-plane.jayasuriya-brunthan.workers.dev"
NEXT_PUBLIC_SANDBOX_PROVIDER = "cloudflare"
NEXT_PUBLIC_APP_NAME = "Open-Inspect Test"
NEXT_PUBLIC_APP_ICON_URL = ""

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "CONTROL_PLANE_WORKER"
service = "oi-test-control-plane"
